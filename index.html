<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Per il mio amore</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #b22222;
      text-align: center;
      padding: 0;
      margin: 0;
    }

    header {
      background-color: #ffe4e1;
      padding: 40px 0 20px;
    }

    main {
      padding: 40px 20px;
    }

    footer {
      background-color: #ffe4e1;
      padding: 20px;
      font-size: 0.9em;
      color: #8b0000;
    }

    h1 {
      font-size: 2.5em;
      margin: 0;
    }

    p {
      font-size: 1.5em;
      margin: 20px 0;
    }

    .cuore {
      font-size: 60px;
      animation: battito 1s infinite;
      margin-top: 40px;
    }

    @keyframes battito {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Buongiorno amore ❤️</h1>
  </header>

  <main>
    <p>Sei il fidanzato migliore del mondo 😘</p>
    <p>Ti amo tanto 💖</p>
    <div class="cuore">❤️</div>
  </main>

  <footer>
    Fatto con amore da [tuo nome] 💌
  </footer>
</body>
</html>
